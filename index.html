    let activeCategory = 'all';

    function selectCategory(cat) {
      activeCategory = cat;
      document.getElementById('step1Hub').classList.add('hidden');
      document.getElementById('step2Menu').classList.remove('hidden');
      
      const badgeMap = {
        'all': 'Viewing Complete Menu',
        'breakfast': 'Breakfast Options',
        'mewar_special': 'Mewar Thali Specials',
        'starters': 'Starters & Kebabs',
        'soups_salads': 'Soups & Salads',
        'indian_main': 'Indian Main Course',
        'chinese': 'Chinese Delicacies',
        'italians': 'Italian Delights',
        'breads_rice': 'Breads, Dal & Rice',
        'beverages': 'Cold Beverages',
        'desserts': 'Halwai Ka Pyaar (Desserts)'
      };
      document.getElementById('activeFilterBadge').innerText = badgeMap[cat] || 'Menu';

      renderMenu();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHub() {
      document.getElementById('step2Menu').classList.add('hidden');
      document.getElementById('step1Hub').classList.remove('hidden');
      document.getElementById('searchInput').value = '';
    }

    function renderMenu() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('menuContainer');
      
      const filtered = menuData.filter(item => {
        const matchesCategory = activeCategory === 'all' || item.cat === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-neutral-500 text-xs">No menu items found. Try another search.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-neutral-900/80 p-3.5 rounded-xl border border-neutral-800 flex justify-between items-start gap-3">
          <div class="space-y-1 flex-1">
            <h3 class="text-xs font-semibold text-white tracking-wide">${item.name}</h3>
            ${item.desc ? `<p class="text-[11px] text-neutral-400 leading-relaxed">${item.desc}</p>` : ''}
            <span class="text-xs font-bold text-amber-400 inline-block pt-0.5">${item.price}</span>
          </div>
        </div>
      `).join('');
    }

    function searchMenu() {
      renderMenu();
    }
  </script>
