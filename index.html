    let activeCategory = 'all';

    function selectCategory(cat) {
      activeCategory = cat;
      document.getElementById('step1Hub').classList.add('hidden');
      document.getElementById('step2Menu').classList.remove('hidden');
      
      const badgeMap = {
        'all': 'Viewing All',
        'breakfast': 'Breakfast',
        'thali': 'Mewar Thali',
        'starters': 'Starters',
        'soups': 'Soups & Salads',
        'indian_main': 'Indian Main',
        'chinese': 'Chinese',
        'italian': 'Italian',
        'breads_rice': 'Breads & Rice',
        'beverages': 'Beverages',
        'desserts': 'Desserts'
      };
      document.getElementById('activeFilterBadge').innerText = badgeMap[cat] || 'Menu';

      renderMenu();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHub() {
      document.getElementById('step2Menu').classList.add('hidden');
      document.getElementById('step1Hub').classList.remove('hidden');
      document.getElementById('searchInput').value = '';
    }

    function renderMenu() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('menuContainer');
      
      const filtered = menuData.filter(item => {
        const matchesCategory = activeCategory === 'all' || item.cat === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-neutral-500 text-xs">No items found matching your search.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-neutral-900/80 p-3.5 rounded-xl border border-neutral-800 flex justify-between items-start gap-3">
          <div class="space-y-1 flex-1">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-sm border border-green-500 flex items-center justify-center">
                <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
              </span>
              ${item.tag ? `<span class="text-[9px] bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded border border-amber-500/20 font-medium">${item.tag}</span>` : ''}
            </div>
            <h3 class="text-xs font-semibold text-white tracking-wide">${item.name}</h3>
            <p class="text-[11px] text-neutral-400 leading-relaxed">${item.desc}</p>
            <span class="text-xs font-bold text-amber-400 inline-block pt-0.5">${item.price}</span>
          </div>
        </div>
      `).join('');
    }

    function searchMenu() {
      renderMenu();
    }
