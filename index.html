<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Mewar Palace & Resort | Culinary Menu</title>
  <!-- Security Headers via Meta Tags -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://fonts.googleapis.com https://fonts.gstatic.com;">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0F0F0F; color: #E5E5E5; }
    .serif { font-family: 'Playfair Display', serif; }
    .gold-text { color: #D4AF37; }
    .gold-border { border-color: #D4AF37; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-20 max-w-md mx-auto min-h-screen border-x border-neutral-800 relative">

  <!-- TOP HEADER (Always Visible) -->
  <header class="text-center pt-6 pb-4 px-4 bg-neutral-900/90 sticky top-0 z-30 border-b border-neutral-800 backdrop-blur-md">
    <span class="text-[10px] tracking-[0.3em] uppercase gold-text font-semibold">Shivpuri, MP</span>
    <h1 class="serif text-xl font-bold text-white tracking-wide">The Mewar Palace</h1>
    <p class="text-[11px] text-neutral-400 italic">Royal Culinary Experience</p>
  </header>

  <!-- STEP 1: INITIAL SELECTION HUB -->
  <section id="step1Hub" class="px-5 pt-6 space-y-6">
    <div class="text-center space-y-1">
      <h2 class="serif text-lg text-amber-400 font-semibold">Welcome to Dining</h2>
      <p class="text-xs text-neutral-400">Select how you would like to explore our menu today</p>
    </div>

    <!-- Category Grid -->
    <div class="grid grid-cols-2 gap-3.5 pt-2">
      <!-- Healthy Options -->
      <button onclick="selectCategory('healthy')" class="bg-gradient-to-br from-neutral-900 to-neutral-800 p-4 rounded-xl border border-emerald-900/50 text-left hover:border-emerald-500/50 transition duration-200 group">
        <div class="w-8 h-8 rounded-full bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 mb-2">
          🥗
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-emerald-400 transition">Healthy & Detox</h3>
        <p class="text-[10px] text-neutral-400 mt-0.5">Low cal, salads & fresh juices</p>
      </button>

      <!-- Royal Cuisines -->
      <button onclick="selectCategory('mewari')" class="bg-gradient-to-br from-neutral-900 to-neutral-800 p-4 rounded-xl border border-amber-900/50 text-left hover:border-amber-500/50 transition duration-200 group">
        <div class="w-8 h-8 rounded-full bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 mb-2">
          👑
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-amber-400 transition">Mewari Cuisines</h3>
        <p class="text-[10px] text-neutral-400 mt-0.5">Authentic royal delicacies</p>
      </button>

      <!-- Starters -->
      <button onclick="selectCategory('starters')" class="bg-gradient-to-br from-neutral-900 to-neutral-800 p-4 rounded-xl border border-neutral-800 text-left hover:border-amber-500/50 transition duration-200 group">
        <div class="w-8 h-8 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-amber-400 mb-2">
          🍢
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-amber-400 transition">Starters & Kebabs</h3>
        <p class="text-[10px] text-neutral-400 mt-0.5">Tandoori & dry appetizers</p>
      </button>

      <!-- Drinks & Beverages -->
      <button onclick="selectCategory('beverages')" class="bg-gradient-to-br from-neutral-900 to-neutral-800 p-4 rounded-xl border border-neutral-800 text-left hover:border-amber-500/50 transition duration-200 group">
        <div class="w-8 h-8 rounded-full bg-neutral-800 border border-neutral-700 flex items-center justify-center text-amber-400 mb-2">
          🍹
        </div>
        <h3 class="text-sm font-semibold text-white group-hover:text-amber-400 transition">Drinks & Lassi</h3>
        <p class="text-[10px] text-neutral-400 mt-0.5">Mocktails, lassi & shakes</p>
      </button>
    </div>

    <!-- View Full Menu Button -->
    <div class="pt-2 text-center">
      <button onclick="selectCategory('all')" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-black font-semibold rounded-xl text-xs tracking-wider uppercase transition">
        Browse Full Menu
      </button>
    </div>
  </section>

  <!-- STEP 2: MENU DISPLAY PAGE (Hidden Initially) -->
  <section id="step2Menu" class="hidden">
    <!-- Back to Hub & Search Controls -->
    <div class="px-4 pt-4 sticky top-[80px] z-20 bg-neutral-900/95 pb-3 border-b border-neutral-800 backdrop-blur-md space-y-3">
      <div class="flex items-center justify-between gap-2">
        <button onclick="showHub()" class="flex items-center gap-1.5 text-xs text-amber-400 font-medium">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
          Categories
        </button>
        <span id="activeFilterBadge" class="text-[11px] bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full border border-neutral-700 font-medium">Viewing All</span>
      </div>

      <!-- Search Input -->
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="searchMenu()" placeholder="Search dishes (e.g. Laal Maas, Paneer)..." 
               class="w-full bg-neutral-800/90 text-xs text-white placeholder-neutral-500 rounded-full py-2 pl-9 pr-4 border border-neutral-700 focus:outline-none focus:border-amber-500">
        <svg class="w-4 h-4 text-neutral-500 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>

      <!-- Quick Switch Pills -->
      <div class="flex space-x-2 overflow-x-auto no-scrollbar pt-1 text-[11px]">
        <button onclick="selectCategory('all')" class="cat-pill bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full whitespace-nowrap border border-neutral-700">All</button>
        <button onclick="selectCategory('healthy')" class="cat-pill bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full whitespace-nowrap border border-neutral-700">Healthy</button>
        <button onclick="selectCategory('mewari')" class="cat-pill bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full whitespace-nowrap border border-neutral-700">Mewari</button>
        <button onclick="selectCategory('starters')" class="cat-pill bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full whitespace-nowrap border border-neutral-700">Starters</button>
        <button onclick="selectCategory('beverages')" class="cat-pill bg-neutral-800 text-neutral-300 px-3 py-1 rounded-full whitespace-nowrap border border-neutral-700">Drinks</button>
      </div>
    </div>

    <!-- Items List Container -->
    <div id="menuContainer" class="px-4 pt-4 space-y-3"></div>
  </section>

  <!-- Security Footer -->
  <footer class="text-center text-neutral-500 text-[10px] mt-10 mb-6 px-4 space-y-1">
    <div class="flex items-center justify-center gap-1 text-emerald-400">
      <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
      <span>Verified Secure Digital Menu</span>
    </div>
    <p>All prices subject to government taxes.</p>
  </footer>

  <script>
    const menuData = [
      { id: 1, name: "Sprouted Moong & Quinoa Salad", price: "₹280", desc: "Tossed with pomegranate, lemon dressing, and mint.", veg: true, cat: "healthy", tag: "Low Calorie" },
      { id: 2, name: "Fresh Tender Coconut Water", price: "₹120", desc: "Served chilled with fresh coconut pulp.", veg: true, cat: "healthy", tag: "Detox" },
      { id: 3, name: "Mewari Junglee Maas", price: "₹550", desc: "Slow-cooked mutton in pure ghee & whole red chillies.", veg: false, cat: "mewari", tag: "Chef's Special" },
      { id: 4, name: "Dal Baati Churma (Thali)", price: "₹450", desc: "Authentic Rajasthani delicacy served with Panchmel Dal.", veg: true, cat: "mewari", tag: "Signature" },
      { id: 5, name: "Royal Saffron Paneer Tikka", price: "₹380", desc: "Cottage cheese marinated in saffron and hand-ground spices.", veg: true, cat: "starters", tag: "Popular" },
      { id: 6, name: "Smoke-Grilled Chicken Wings", price: "₹420", desc: "Charcoal-grilled wings with royal spices.", veg: false, cat: "starters", tag: "" },
      { id: 7, name: "Kesariya Saffron Lassi", price: "₹140", desc: "Thick chilled yoghurt blend infused with Kashmiri saffron.", veg: true, cat: "beverages", tag: "Refreshing" },
      { id: 8, name: "Fresh Lime Mint Cooler", price: "₹110", desc: "Sparkling water infused with crushed mint and fresh lemon.", veg: true, cat: "beverages", tag: "" }
    ];

    let activeCategory = 'all';

    function selectCategory(cat) {
      activeCategory = cat;
      document.getElementById('step1Hub').classList.add('hidden');
      document.getElementById('step2Menu').classList.remove('hidden');
      
      // Update badge label
      const badgeMap = {
        'all': 'Viewing All',
        'healthy': 'Healthy & Detox',
        'mewari': 'Mewari Cuisines',
        'starters': 'Starters',
        'beverages': 'Drinks & Beverages'
      };
      document.getElementById('activeFilterBadge').innerText = badgeMap[cat] || 'Menu';

      renderMenu();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHub() {
      document.getElementById('step2Menu').classList.add('hidden');
      document.getElementById('step1Hub').classList.remove('hidden');
      document.getElementById('searchInput').value = '';
    }

    function renderMenu() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const container = document.getElementById('menuContainer');
      
      const filtered = menuData.filter(item => {
        const matchesCategory = activeCategory === 'all' || item.cat === activeCategory;
        const matchesSearch = item.name.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-neutral-500 text-xs">No items found matching your criteria.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-neutral-900/80 p-3.5 rounded-xl border border-neutral-800 flex justify-between items-start gap-3">
          <div class="space-y-1 flex-1">
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-sm border ${item.veg ? 'border-green-500 flex items-center justify-center' : 'border-red-500 flex items-center justify-center'}">
                <span class="w-1.5 h-1.5 rounded-full ${item.veg ? 'bg-green-500' : 'bg-red-500'}"></span>
              </span>
              ${item.tag ? `<span class="text-[9px] bg-amber-500/10 text-amber-400 px-1.5 py-0.5 rounded border border-amber-500/20 font-medium">${item.tag}</span>` : ''}
            </div>
            <h3 class="text-xs font-semibold text-white tracking-wide">${item.name}</h3>
            <p class="text-[11px] text-neutral-400 leading-relaxed">${item.desc}</p>
            <span class="text-xs font-bold text-amber-400 inline-block pt-0.5">${item.price}</span>
          </div>
        </div>
      `).join('');
    }

    function searchMenu() {
      renderMenu();
    }
  </script>
</body>
</html>
